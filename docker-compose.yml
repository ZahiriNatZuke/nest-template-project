# Development stack: the API plus the PostgreSQL instance it talks to.
#
#   docker compose up --build
#
# Copy .env.template to .env first — the api service reads it via `env_file`,
# and the app refuses to boot if any required variable is missing.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-dev_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone reports ready during the init phase, before the
      # bootstrap scripts have finished, so the database name is pinned too.
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dev_db}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides whatever host the .env file points at: inside the compose
      # network the database answers to the service name, not to localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-dev_db}?schema=public
      HOST: ${HOST:-localhost}
      PORT: 3000
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api-logs:/app/logs

volumes:
  postgres-data:
  api-logs:
