name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a pnpm release cannot change CI behaviour without a commit.
  PNPM_VERSION: 10.33.0
  # prisma.config.ts resolves `env('DATABASE_URL')` eagerly and throws when it
  # is unset, so every Prisma CLI invocation needs it present — including
  # `generate` and `validate`, which never open a connection. Without a .env
  # file on the runner, the first `prisma generate` fails with
  # PrismaConfigEnvError before anything else can run.
  #
  # Set at workflow level so both jobs inherit it. The e2e job talks to a real
  # PostgreSQL at this address; the quality job only needs the variable to
  # exist and never connects.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nest_template_test?schema=public

jobs:
  quality:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          # @nestjs/core declares `node >= 20`; 22 is the current LTS.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # Types from the generated client are needed by both the typecheck and
        # the unit tests, so this cannot wait for the build step.
        run: pnpm prisma generate

      - name: Validate Prisma schema
        run: pnpm prisma validate

      - name: Lint
        # `biome ci` is the read-only counterpart of the `lint` script, which
        # applies fixes — CI must fail on findings, not silently rewrite them.
        run: pnpm exec biome ci

      - name: Typecheck
        # The test transformer is @swc/jest, which strips types without
        # checking them. This step is what keeps the specs type-safe.
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nest_template_test
        # 5433 on the host matches DATABASE_URL in .env.test, so the suite runs
        # identically here and against docker-compose.test.yml locally.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nest_template_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations to the test database
        run: pnpm prisma migrate deploy

      - name: End-to-end tests
        run: pnpm run test:e2e
