name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The pnpm version lives in package.json's `packageManager` field, which
# corepack reads on the runner, in Docker and on a developer machine alike. It
# used to be pinned here and nowhere else, so CI ran 10.33 while a local
# corepack picked up whatever was newest — which is how a lockfile written by
# one version came to be rejected by another.
#
# DATABASE_URL is no longer set workflow-wide. prisma.config.ts now reads the
# variable directly instead of through prisma's eager `env()` helper, so
# `generate` and `validate` — neither of which opens a connection — run without
# it. Only the e2e job, which talks to a real database, declares it.
jobs:
  quality:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # No `version:` — the action reads `packageManager` from package.json,
      # which is the single source of truth for every environment.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # @nestjs/core declares `node >= 20`; 22 is the current LTS.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # Types from the generated client are needed by both the typecheck and
        # the unit tests, so this cannot wait for the build step.
        run: pnpm prisma generate

      - name: Validate Prisma schema
        run: pnpm prisma validate

      - name: Lint
        # `biome ci` is the read-only counterpart of the `lint` script, which
        # applies fixes — CI must fail on findings, not silently rewrite them.
        run: pnpm exec biome ci

      - name: Typecheck
        # The test transformer is @swc/jest, which strips types without
        # checking them. This step is what keeps the specs type-safe.
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    env:
      # Matches .env.test and docker-compose.test.yml, so the suite runs
      # identically here and locally.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nest_template_test?schema=public

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nest_template_test
        # 5433 on the host matches DATABASE_URL in .env.test, so the suite runs
        # identically here and against docker-compose.test.yml locally.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nest_template_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      # No `version:` — the action reads `packageManager` from package.json,
      # which is the single source of truth for every environment.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations to the test database
        run: pnpm prisma migrate deploy

      - name: End-to-end tests
        run: pnpm run test:e2e

  # Un secreto que llega a la historia de git ya está comprometido aunque se borre después: el
  # commit sigue ahí y en un repositorio público ya lo ha visto quien quisiera. El secret
  # scanning de GitHub cubre los patrones que reconoce; gitleaks añade los que no.
  # `fetch-depth: 0` es imprescindible: sin la historia completa solo miraría el último commit.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
