version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR per ecosystem instead of one per package: these move in lockstep
      # and reviewing them apart is busywork.
      nestjs:
        patterns:
          - '@nestjs/*'
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
      fastify:
        patterns:
          - 'fastify'
          - '@fastify/*'
      types:
        patterns:
          - '@types/*'
      dev-tooling:
        patterns:
          - '@biomejs/*'
          - '@swc/*'
          - 'jest'
          - 'ts-node'
          - 'typescript'
    ignore:
      # TypeScript is held at 5.x. Verified against 6.0.3: `baseUrl` becomes a
      # deprecation *error* needing `ignoreDeprecations`, and the tighter
      # `catch` typing turns `e` into `unknown`, breaking verify-jwt.guard.ts
      # and password.service.ts. Raising this needs a migration commit, not a
      # version bump — see the note in the README before changing it.
      - dependency-name: typescript
        versions: ['>=6']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
