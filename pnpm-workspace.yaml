# Security overrides for transitive dependencies.
#
# Every entry here is a package we do not depend on directly: they arrive
# through fastify and the @nestjs/* packages, which pin exact versions. Upstream
# has not shipped the bumps yet — @nestjs/platform-fastify 11.1.28 and fastify
# 5.10.0 are both the current releases and still resolve the vulnerable ones —
# so an override is the only way to get patched code without waiting.
#
# `@fastify/static` is deliberately NOT here: it is a direct dependency in
# package.json instead. It reaches us as an optional peer that pnpm was
# auto-installing, and overriding an auto-installed optional peer stops pnpm
# installing it at all — which takes the application down at boot, because
# Swagger needs it to serve its UI under Fastify. Something the app cannot start
# without belongs in `dependencies`.
#
# Revisit on every @nestjs/platform-fastify or fastify upgrade: once the parent
# resolves a patched version on its own, the entry becomes dead weight and
# should be dropped rather than left to pin something older than upstream.
overrides:
  # Router confusion in the fastify route matcher.
  find-my-way: '9.7.0'
  # ReDoS in the URI parser used by ajv and @fastify/ajv-compiler.
  fast-uri: '3.1.4'
  ajv: '8.18.0'
  # Prototype pollution; reaches us through @nestjs/swagger.
  js-yaml: '5.2.2'

# @nestjs/platform-fastify declares `@fastify/static: ^8.0.0 || ^9.0.0`, and the
# only version without an open advisory is 10.1.2. The peer is optional and the
# adapter only touches this package through `useStaticAssets()`, which this
# template does not call — what actually consumes it is @nestjs/swagger, whose
# own peer range already allows ^10.
#
# Verified rather than assumed: with 10.1.2 the application boots, /swagger
# answers 200 and it serves swagger-ui.css and swagger-ui-bundle.js, which is
# the whole of what this dependency does here.
#
# Drop this once @nestjs/platform-fastify widens its range.
peerDependencyRules:
  allowedVersions:
    '@nestjs/platform-fastify>@fastify/static': '10'

onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - '@swc/core'
  - bcrypt
  - better-sqlite3
  - nestjs-pino
  - nice-napi
  - prisma
  - unrs-resolver
